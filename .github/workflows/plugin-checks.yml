name: Plugin checks

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'tools/waypost/**'
      - 'tests/test_plugin_marketplace.py'
      - 'tests/test_waypost_oauth_mock.py'
      - 'tests/test_waypost_assemble.py'
      - 'examples/waypost-oauth/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-checks.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/waypost/**'
      - 'tests/test_plugin_marketplace.py'
      - 'tests/test_waypost_oauth_mock.py'
      - 'tests/test_waypost_assemble.py'
      - 'examples/waypost-oauth/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plugin package and bridge fixture tests
        run: python -m unittest discover -s tests -p 'test_plugin*.py' -v
      - name: OAuth configuration and available Codex mock tests
        run: python -m unittest discover -s tests -p 'test_waypost_oauth_mock.py' -v
      - name: Marketplace assembly tests
        run: python -m unittest discover -s tests -p 'test_waypost_assemble.py' -v

  bridge-package:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch pinned source and locked dependencies
        run: |
          git clone https://github.com/miles1150/waypost.git "$RUNNER_TEMP/waypost-source"
          git -C "$RUNNER_TEMP/waypost-source" checkout --detach 9f70cbf3779211544739ff7998b93895b8618944
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/waypost-source/bridge/Cargo.toml"
      - name: Build and check actual bridge bundle
        run: |
          python tools/waypost/build_bundle.py --source "$RUNNER_TEMP/waypost-source" --output "$RUNNER_TEMP/waypost-plugin"
          python "$RUNNER_TEMP/waypost-plugin/skills/waypost/scripts/bridge.py" doctor
          # This pinned bridge has no --help command; it exits with its usage error.
          set +e
          output=$(python "$RUNNER_TEMP/waypost-plugin/skills/waypost/scripts/bridge.py" bridge --help 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac
      - name: Archive bundle with executable permissions
        run: |
          cd "$RUNNER_TEMP"
          tar -czf "waypost-plugin-${{ matrix.target }}.tar.gz" waypost-plugin
          shasum -a 256 "waypost-plugin-${{ matrix.target }}.tar.gz" > "waypost-plugin-${{ matrix.target }}.tar.gz.sha256"
          mkdir bundle-check
          tar -xzf "waypost-plugin-${{ matrix.target }}.tar.gz" -C bundle-check
          python bundle-check/waypost-plugin/skills/waypost/scripts/bridge.py doctor
      - uses: actions/upload-artifact@v4
        with:
          name: waypost-plugin-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/waypost-plugin-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/waypost-plugin-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  assemble-marketplace:
    needs: bridge-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: waypost-plugin-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/platforms/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: waypost-plugin-x86_64-apple-darwin
          path: ${{ runner.temp }}/platforms/x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: waypost-plugin-aarch64-apple-darwin
          path: ${{ runner.temp }}/platforms/aarch64-apple-darwin
      - name: Assemble and archive local marketplace
        run: |
          python tools/waypost/assemble_market.py --input "$RUNNER_TEMP/platforms" --output "$RUNNER_TEMP/personal-plugins-market"
          cd "$RUNNER_TEMP"
          tar -czf personal-plugins-market.tar.gz personal-plugins-market
          shasum -a 256 personal-plugins-market.tar.gz > personal-plugins-market.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: personal-plugins-market
          path: |
            ${{ runner.temp }}/personal-plugins-market.tar.gz
            ${{ runner.temp }}/personal-plugins-market.tar.gz.sha256
          if-no-files-found: error

  install-marketplace:
    needs: assemble-marketplace
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            claude: claude-code-linux-x64
          - os: macos-15
            claude: claude-code-darwin-arm64
          - os: macos-15-intel
            claude: claude-code-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: personal-plugins-market
          path: ${{ runner.temp }}/market-download
      - name: Check and unpack marketplace
        run: |
          cd "$RUNNER_TEMP/market-download"
          shasum -a 256 -c personal-plugins-market.tar.gz.sha256
          tar -xzf personal-plugins-market.tar.gz
      - name: Install pinned host clients for isolated testing
        run: npm install --prefix "$RUNNER_TEMP/host-tools" --ignore-scripts --no-audit --no-fund @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.296
      - name: Install and verify Codex plugin
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex="$RUNNER_TEMP/host-tools/node_modules/.bin/codex"
          market="$RUNNER_TEMP/market-download/personal-plugins-market"
          "$codex" plugin marketplace add "$market"
          "$codex" plugin add waypost@personal-plugins
          "$codex" plugin list --marketplace personal-plugins --json
          bridge="$CODEX_HOME/plugins/cache/personal-plugins/waypost/0.3.0/skills/waypost/scripts/bridge.py"
          python "$bridge" doctor
          set +e
          output=$(python "$bridge" bridge --help 2>&1); status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac
      - name: Install and verify Claude Code plugin
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude="$RUNNER_TEMP/host-tools/node_modules/@anthropic-ai/${{ matrix.claude }}/claude"
          market="$RUNNER_TEMP/market-download/personal-plugins-market"
          "$claude" plugin validate "$market"
          "$claude" plugin marketplace add "$market"
          "$claude" plugin install waypost@personal-plugins
          "$claude" plugin list
          bridge="$CLAUDE_CONFIG_DIR/plugins/cache/personal-plugins/waypost/0.3.0/skills/waypost/scripts/bridge.py"
          python "$bridge" doctor
          set +e
          output=$(python "$bridge" bridge --help 2>&1); status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac

  publish-verified-marketplace:
    # One-time distribution ref for this reviewed version. Never run for forks
    # or other branches, and never replace an existing ref.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/personal-plugin-marketplace'
    needs: install-marketplace
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The distribution commit must not introduce workflow files: the
          # repository's Actions token deliberately lacks workflows permission.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: personal-plugins-market
          path: ${{ runner.temp }}/market-download
      - name: Create versioned distribution branch without overwriting
        run: |
          ref=refs/heads/distribution/waypost-v0.3.0
          if test -n "$(git ls-remote --heads origin "$ref")"; then
            echo "Distribution ref already exists; leaving it unchanged."
            exit 0
          fi
          cd "$RUNNER_TEMP/market-download"
          shasum -a 256 -c personal-plugins-market.tar.gz.sha256
          tar -xzf personal-plugins-market.tar.gz
          cd "$GITHUB_WORKSPACE"
          market="$RUNNER_TEMP/market-download/personal-plugins-market"
          test ! -e plugins/waypost
          test ! -e .agents/plugins/marketplace.json
          test ! -e .claude-plugin/marketplace.json
          cmp plugins/keyenv/skills/keyenv/SKILL.md "$market/plugins/keyenv/skills/keyenv/SKILL.md"
          mkdir -p .agents/plugins .claude-plugin plugins/keyenv/.claude-plugin
          cp "$market/.agents/plugins/marketplace.json" .agents/plugins/marketplace.json
          cp "$market/.claude-plugin/marketplace.json" .claude-plugin/marketplace.json
          cp "$market/plugins/keyenv/plugin.json" plugins/keyenv/plugin.json
          cp "$market/plugins/keyenv/.claude-plugin/plugin.json" plugins/keyenv/.claude-plugin/plugin.json
          cp -R "$market/plugins/waypost" plugins/waypost
          git add .agents/plugins/marketplace.json .claude-plugin/marketplace.json plugins/keyenv/plugin.json plugins/keyenv/.claude-plugin/plugin.json plugins/waypost
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bundle verified Waypost bridge marketplace 0.3.0' -m 'Source PR commit: ${{ github.event.pull_request.head.sha }}'
          git push --force-with-lease="$ref:" origin "HEAD:$ref"
