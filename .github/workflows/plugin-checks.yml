name: Plugin checks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated immutable distribution for this commit
        type: boolean
        default: false
  pull_request:
    paths:
      - 'plugins/**'
      - 'tools/waypost/**'
      - 'services/waypost/bridge/**'
      - 'tests/test_plugin_marketplace.py'
      - 'tests/test_dcr_hosts.py'
      - 'tests/test_bridge_refresh_model.py'
      - 'tests/test_waypost_assemble.py'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-checks.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/waypost/**'
      - 'services/waypost/bridge/**'
      - 'tests/test_plugin_marketplace.py'
      - 'tests/test_dcr_hosts.py'
      - 'tests/test_bridge_refresh_model.py'
      - 'tests/test_waypost_assemble.py'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plugin package and bridge fixture tests
        run: python -m unittest discover -s tests -p 'test_plugin*.py' -v
      - name: OAuth configuration and available host tests
        run: python -m unittest discover -s tests -p 'test_dcr_hosts.py' -v
      - name: Bridge refresh state model
        run: python -m unittest discover -s tests -p 'test_bridge_refresh_model.py' -v
      - name: Marketplace assembly tests
        run: python -m unittest discover -s tests -p 'test_waypost_assemble.py' -v

  bridge-package:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Fetch pinned source and locked dependencies
        run: |
          cargo fetch --locked --manifest-path services/waypost/bridge/Cargo.toml
      - name: Test bridge on the package platform
        run: cargo test --locked --manifest-path services/waypost/bridge/Cargo.toml
      - name: Build and check actual bridge bundle
        run: |
          python tools/waypost/build_bundle.py --monorepo --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/miles-works-plugin"
          python "$RUNNER_TEMP/miles-works-plugin/skills/waypost/scripts/bridge.py" doctor
          # This pinned bridge has no --help command; it exits with its usage error.
          set +e
          output=$(python "$RUNNER_TEMP/miles-works-plugin/skills/waypost/scripts/bridge.py" bridge --help 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac
      - name: Archive bundle with executable permissions
        run: |
          cd "$RUNNER_TEMP"
          tar -czf "miles-works-plugin-${{ matrix.target }}.tar.gz" miles-works-plugin
          shasum -a 256 "miles-works-plugin-${{ matrix.target }}.tar.gz" > "miles-works-plugin-${{ matrix.target }}.tar.gz.sha256"
          mkdir bundle-check
          tar -xzf "miles-works-plugin-${{ matrix.target }}.tar.gz" -C bundle-check
          python bundle-check/miles-works-plugin/skills/waypost/scripts/bridge.py doctor
      - uses: actions/upload-artifact@v4
        with:
          name: miles-works-plugin-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/miles-works-plugin-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/miles-works-plugin-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  assemble-marketplace:
    needs: bridge-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: miles-works-plugin-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/platforms/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: miles-works-plugin-x86_64-apple-darwin
          path: ${{ runner.temp }}/platforms/x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: miles-works-plugin-aarch64-apple-darwin
          path: ${{ runner.temp }}/platforms/aarch64-apple-darwin
      - name: Assemble and archive local marketplace
        run: |
          python tools/waypost/assemble_market.py --input "$RUNNER_TEMP/platforms" --output "$RUNNER_TEMP/personal-plugins-market"
          cd "$RUNNER_TEMP"
          tar -czf personal-plugins-market.tar.gz personal-plugins-market
          shasum -a 256 personal-plugins-market.tar.gz > personal-plugins-market.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: personal-plugins-market
          path: |
            ${{ runner.temp }}/personal-plugins-market.tar.gz
            ${{ runner.temp }}/personal-plugins-market.tar.gz.sha256
          if-no-files-found: error

  install-marketplace:
    needs: assemble-marketplace
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            claude: claude-code-linux-x64
          - os: macos-15
            claude: claude-code-darwin-arm64
          - os: macos-15-intel
            claude: claude-code-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: personal-plugins-market
          path: ${{ runner.temp }}/market-download
      - name: Check and unpack marketplace
        run: |
          cd "$RUNNER_TEMP/market-download"
          shasum -a 256 -c personal-plugins-market.tar.gz.sha256
          tar -xzf personal-plugins-market.tar.gz
      - name: Install pinned host clients for isolated testing
        run: npm install --prefix "$RUNNER_TEMP/host-tools" --ignore-scripts --no-audit --no-fund @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.296
      - name: Install and verify Codex plugin
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex="$RUNNER_TEMP/host-tools/node_modules/.bin/codex"
          market="$RUNNER_TEMP/market-download/personal-plugins-market"
          "$codex" plugin marketplace add "$market"
          "$codex" plugin add miles-works@personal-plugins
          "$codex" plugin list --marketplace personal-plugins --json
          version=$(python -c 'import json; print(json.load(open("plugins/miles-works/plugin.json"))["version"])')
          bridge="$CODEX_HOME/plugins/cache/personal-plugins/miles-works/$version/skills/waypost/scripts/bridge.py"
          python "$bridge" doctor
          set +e
          output=$(python "$bridge" bridge --help 2>&1); status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac
      - name: Install and verify Claude Code plugin
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude="$RUNNER_TEMP/host-tools/node_modules/@anthropic-ai/${{ matrix.claude }}/claude"
          market="$RUNNER_TEMP/market-download/personal-plugins-market"
          "$claude" plugin validate "$market/plugins/miles-works" --strict
          "$claude" plugin marketplace add "$market"
          "$claude" plugin install miles-works@personal-plugins
          "$claude" plugin list
          version=$(python -c 'import json; print(json.load(open("plugins/miles-works/plugin.json"))["version"])')
          bridge="$CLAUDE_CONFIG_DIR/plugins/cache/personal-plugins/miles-works/$version/skills/waypost/scripts/bridge.py"
          python "$bridge" doctor
          set +e
          output=$(python "$bridge" bridge --help 2>&1); status=$?
          set -e
          test "$status" -ne 0
          case "$output" in *'usage: waypost-bridge --config FILE'*) ;; *) printf '%s\n' "$output"; exit 1 ;; esac
      - name: Verify host discovery, upgrades and local OAuth (simulated macOS credential store)
        run: |
          export PATH="$RUNNER_TEMP/host-tools/node_modules/.bin:$PATH"
          export WAYPOST_TEST_CLAUDE="$RUNNER_TEMP/host-tools/node_modules/@anthropic-ai/${{ matrix.claude }}/claude"
          python -m unittest discover -s tests -p 'test_dcr_hosts.py' -v

  publish-miles-works:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: install-marketplace
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: personal-plugins-market
          path: ${{ runner.temp }}/market-download
      - name: Publish immutable Miles Works distribution
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json,re; v=json.load(open("plugins/miles-works/plugin.json"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')
          export PLUGIN_VERSION="$version"
          ref="refs/heads/distribution/miles-works-v$version"
          if test -n "$(git ls-remote --heads origin "$ref")"; then
            echo "Distribution ref exists; leaving it unchanged."
            exit 0
          fi
          cd "$RUNNER_TEMP/market-download"
          shasum -a 256 -c personal-plugins-market.tar.gz.sha256
          tar -xzf personal-plugins-market.tar.gz
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path('.')
          package=pathlib.Path(os.environ['RUNNER_TEMP'])/'market-download/personal-plugins-market/plugins/miles-works'
          assert json.loads((package/'plugin.json').read_text())['version']==os.environ['PLUGIN_VERSION']
          assert json.loads((package/'.mcp.json').read_text())['mcpServers']=={'miles-works':{'type':'http','url':'https://works.miles1150.top/mcp'}}
          for name in ('miles-works','waypost','keyenv','keyenv-remote'):
              directory=root/'plugins'/name
              if directory.exists():shutil.rmtree(directory)
          shutil.copytree(package,root/'plugins/miles-works')
          for file in ['.agents/plugins/marketplace.json','.claude-plugin/marketplace.json']:
              p=root/file; data=json.loads(p.read_text())
              entry=next(x for x in data['plugins'] if x['name']=='miles-works')
              data['plugins']=[entry]
              entry['source']={'source':'local','path':'./plugins/miles-works'} if file.startswith('.agents') else './plugins/miles-works'
              if 'description' in entry:entry['description']='Messages and personal keys through one Miles Works connection'
              p.write_text(json.dumps(data,indent=2)+'\n')
          (root/'MILES-WORKS-RELEASE.json').write_text(json.dumps({'version':os.environ['PLUGIN_VERSION'],'source_commit':os.environ['SOURCE_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],'mcp':'https://works.miles1150.top/mcp','login':'User completes login and consent; installation does not authorize access.'},indent=2)+'\n')
          PY
          # Publish a package-only root tree; never inherit stale main workflows.
          git read-tree --empty
          git add plugins/miles-works .agents/plugins/marketplace.json .claude-plugin/marketplace.json MILES-WORKS-RELEASE.json
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -m "Distribute verified Miles Works $version")
          git push --force-with-lease="$ref:" origin "$commit:$ref"
