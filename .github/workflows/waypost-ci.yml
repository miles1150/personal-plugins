name: Waypost service checks
on:
  push:
    paths: ['services/waypost/**', 'tools/keyenv/**', '.github/workflows/waypost-ci.yml']
  pull_request:
    paths: ['services/waypost/**', 'tools/keyenv/**', '.github/workflows/waypost-ci.yml']
defaults:
  run:
    working-directory: services/waypost
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/waypost -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --locked
      - run: cargo build --locked --manifest-path bridge/Cargo.toml
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/keyenv/go.mod
          cache-dependency-path: tools/keyenv/go.sum
      - name: Build keyenv-remote CLI
        working-directory: tools/keyenv
        run: go build -o "$RUNNER_TEMP/keyenv-remote" ./cmd/keyenv-remote
      - name: Native keys and CLI integration with synthetic identity
        run: python3 scripts/verify_keys_native.py --waypost "$PWD/target/debug/waypost" --keyenv-remote "$RUNNER_TEMP/keyenv-remote"
      - name: Local participant protocol and simulated wake acceptance
        run: python3 scripts/verify_participant_flows.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/waypost/examples/mcp-client/package-lock.json
      - run: npm ci --prefix examples/mcp-client --ignore-scripts
      - run: node --test tests/works_ui.mjs tests/keys_ui.mjs
      - name: Native SDK and complete demo
        env:
          WAYPOST_ADMIN_SECRET: ci-only-admin-secret-32-bytes-long
          WAYPOST_PUBLIC_ORIGIN: http://127.0.0.1:8787
        run: |
          target/debug/waypost serve --data /tmp/waypost-ci --listen 127.0.0.1:8787 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 1
          done
          node examples/mcp-client/demo.mjs
          node examples/mcp-client/handoff.mjs
          # The retired standalone dashboard is no longer served. Current v2
          # dashboard coverage runs in works_ui and unified_worker below.
          python3 examples/demo.py --output /tmp/waypost-demo
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/waypost -> target
      - run: cargo check --locked --no-default-features --features cloudflare --target wasm32-unknown-unknown
      - run: cargo clippy --locked --no-default-features --features cloudflare --target wasm32-unknown-unknown -- -D warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the container
        run: |
          docker build -t waypost:ci .
          docker run -d --name waypost-ci -p 127.0.0.1:8788:8787 -e WAYPOST_PUBLIC_ORIGIN=http://127.0.0.1:8788 -e WAYPOST_ADMIN_SECRET=ci-only-admin-secret-32-bytes-long waypost:ci
          trap 'docker rm -f waypost-ci' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8788/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8788/health
          test "$(docker exec waypost-ci id -u)" = 10001
  worker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/waypost -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/waypost/examples/mcp-client/package-lock.json
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: npm ci --prefix examples/mcp-client --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/keyenv/go.mod
          cache-dependency-path: tools/keyenv/go.sum
      - name: Build keyenv-remote CLI
        working-directory: tools/keyenv
        run: go build -o "$RUNNER_TEMP/keyenv-remote" ./cmd/keyenv-remote
      - name: Exercise actual Workerd, D1, R2 and deployment guards
        env:
          WAYPOST_ADMIN_SECRET: ci-only-admin-secret-32-bytes-long
          WAYPOST_ENCRYPTION_KEYS: '{"active":"ci","keys":{"ci":"1111111111111111111111111111111111111111111111111111111111111111"}}'
          WAYPOST_URL: http://127.0.0.1:8791
          WRANGLER_SEND_METRICS: 'false'
        run: |
          printf 'WAYPOST_ADMIN_SECRET="%s"\n' "$WAYPOST_ADMIN_SECRET" > .dev.vars
          printf "WAYPOST_ENCRYPTION_KEYS='%s'\n" "$WAYPOST_ENCRYPTION_KEYS" >> .dev.vars
          npx --yes wrangler@4.111.0 d1 migrations apply waypost --local
          npx --yes wrangler@4.111.0 dev --local --port 8791 > /tmp/waypost-worker.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          ready=false
          for attempt in $(seq 1 180); do
            if curl --fail --silent "$WAYPOST_URL/health" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then tail -n 60 /tmp/waypost-worker.log; exit 1; fi
          node examples/mcp-client/demo.mjs
          node examples/mcp-client/handoff.mjs
          # V2 UI and MCP are exercised together against the compiled unified
          # Worker and isolated D1/R2 in tests/unified_worker.mjs below.
          python3 examples/demo.py --url "$WAYPOST_URL" --output /tmp/waypost-worker-demo
          python3 scripts/verify_deployment.py --url "$WAYPOST_URL" --check-rate-limit --check-api-rate-limit
          node tests/google_jwks_worker.mjs
          node tests/unified_worker.mjs
          node tests/operator_retirement_worker.mjs
          node tests/oauth_client_discovery_worker.mjs
      - name: Keys Worker and CLI integration with synthetic identity
        run: |
          worker-build --release --no-default-features --features cloudflare
          node scripts/serve_local_workerd.mjs --product keys --port 8795 --dcr > "$RUNNER_TEMP/keys-worker.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          ready=false
          for attempt in $(seq 1 120); do
            if grep -q '"ready":true' "$RUNNER_TEMP/keys-worker.log"; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/keys-worker.log"; exit 1; fi
          python3 scripts/verify_keys_native.py --base http://127.0.0.1:8795 --keyenv-remote "$RUNNER_TEMP/keyenv-remote"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: worker-runtime-log
          path: |
            /tmp/waypost-worker.log
            ${{ runner.temp }}/keys-worker.log
