name: Keyenv laboratory checks

on:
  push:
    paths: ['tools/keyenv/**', '.github/workflows/keyenv-lab.yml', '.github/workflows/keyenv-release.yml']
  pull_request:
    paths: ['tools/keyenv/**', '.github/workflows/keyenv-lab.yml', '.github/workflows/keyenv-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/keyenv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/keyenv/go.mod
          cache-dependency-path: tools/keyenv/go.sum
      - run: CGO_ENABLED=0 go test -count=1 ./...
      # Optional development check; hosted runners provide a C toolchain.
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o bin/keyenv-lab ./cmd/keyenv-lab
      - run: CGO_ENABLED=0 go build -o bin/keyenv ./cmd/keyenv
      - run: ./bin/keyenv-lab simulate
      # Neither job authorizes Google or prompts for a real password.
      - run: sh -n scripts/*.sh
      - name: Distribution checks (synthetic, no Google access)
        if: runner.os == 'Linux'
        run: |
          ./scripts/build-release.sh keyenv-v0.1.0-rc.1 "$RUNNER_TEMP/keyenv-release"
          python3 scripts/test-distribution.py "$RUNNER_TEMP/keyenv-release"
