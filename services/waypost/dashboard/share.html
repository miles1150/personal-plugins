<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Shared design</title><link rel="stylesheet" href="/share/share.css"><script defer src="/share/viewer.js"></script></head><body class="viewer">
<header id="bar" class="bar" hidden><h1 id="title" class="bar-title"></h1><p id="hint" class="hint" hidden></p><div class="bar-actions"><button id="add" type="button" class="primary" hidden></button><button id="cancel" type="button" hidden></button><button id="toggle" type="button" aria-controls="panel" aria-expanded="false" hidden></button></div></header>
<main class="stage"><iframe id="frame" title="" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms allow-modals" referrerpolicy="no-referrer" hidden></iframe>
<section id="state" class="state" aria-live="polite"><h2 id="state-title"></h2><p id="state-body"></p><button id="retry" type="button" hidden></button></section>
<aside id="panel" class="panel" hidden aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title"></h2><button id="close" type="button" class="icon" aria-label="Close"><span aria-hidden="true">×</span></button></div>
<form id="form" class="compose" hidden><p id="spot" class="spot"></p><label for="name" id="name-label"></label><input id="name" autocomplete="name" maxlength="60" required><label for="body" id="body-label"></label><textarea id="body" rows="4" maxlength="4000" required></textarea><p id="form-error" class="error" role="alert"></p><div class="row"><button id="post" type="submit" class="primary"></button><button id="discard" type="button"></button></div></form>
<p id="empty" class="muted" hidden></p><ol id="threads" class="threads"></ol></aside></main>
</body></html>
