
<script>(()=>{"use strict";const P=window.parent;if(P===window)return;let pins=[],layer=null,cover=null;
const size=()=>{const d=document.documentElement,b=document.body;return{w:Math.max(d.scrollWidth,b?b.scrollWidth:0,innerWidth),h:Math.max(d.scrollHeight,b?b.scrollHeight:0,innerHeight)}};
const view=()=>{const h=location.hash;return h==='#1'?'':h.slice(0,64)};
const post=m=>P.postMessage(m,'*');
const clamp=n=>Math.min(1,Math.max(0,n));
function path(el){const parts=[];for(let n=el;n&&n.nodeType===1&&n!==document.documentElement&&parts.length<30;n=n.parentElement){if(n.id&&/^[A-Za-z][\w-]{0,60}$/.test(n.id)){parts.unshift('#'+n.id);break}let i=1;for(let s=n.previousElementSibling;s;s=s.previousElementSibling)if(s.tagName===n.tagName)i++;parts.unshift(n.tagName.toLowerCase()+':nth-of-type('+i+')')}const p=parts.join('>');return p.length<=500?p:''}
function where(p){const s=size();if(p.selector){let el=null;try{el=document.querySelector(p.selector)}catch(e){}if(el){const r=el.getBoundingClientRect();if(r.width>0&&r.height>0)return{x:r.left+scrollX+p.rx*r.width,y:r.top+scrollY+p.ry*r.height}}}return{x:p.x*s.w,y:p.y*s.h}}
function ensure(){if(!document.body)return false;if(!layer||!layer.isConnected){layer=document.createElement('div');layer.style.cssText='position:absolute;left:0;top:0;width:0;height:0;z-index:2147483646;pointer-events:none';document.body.appendChild(layer)}return true}
function draw(){if(!ensure())return;layer.textContent='';const v=view();for(const p of pins){if((p.view||'')!==v)continue;const at=where(p);const b=document.createElement('button');b.type='button';b.textContent=String(p.n);b.setAttribute('aria-label',p.label||('Comment '+p.n));b.style.cssText='position:absolute;pointer-events:auto;left:'+at.x+'px;top:'+(at.y-30)+'px;width:30px;height:30px;padding:0;margin:0;border-radius:15px 15px 15px 3px;border:2px solid #fff;background:'+(p.active?'#1d1d1f':'#bb4d30')+';color:#fff;font:600 13px/26px system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();post({type:'share:pin',id:p.id})});layer.appendChild(b)}}
function setMode(on){if(!document.body)return;if(!on){if(cover)cover.remove();return}if(!cover){cover=document.createElement('div');cover.style.cssText='position:absolute;left:0;top:0;z-index:2147483647;cursor:crosshair;background:transparent';cover.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const s=size();cover.style.display='none';if(layer)layer.style.display='none';const el=document.elementFromPoint(e.clientX,e.clientY);cover.style.display='';if(layer)layer.style.display='';const out={type:'share:point',x:clamp(e.pageX/s.w),y:clamp(e.pageY/s.h),view:view(),text:'',selector:'',rx:0,ry:0};if(el&&el!==document.body&&el!==document.documentElement){const r=el.getBoundingClientRect();if(r.width>0&&r.height>0){out.selector=path(el);out.rx=clamp((e.clientX-r.left)/r.width);out.ry=clamp((e.clientY-r.top)/r.height)}if(el.tagName!=='IFRAME')out.text=(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,120);else out.text=(el.title||'').slice(0,120)}post(out)})}const s=size();cover.style.width=s.w+'px';cover.style.height=s.h+'px';document.body.appendChild(cover)}
function focusPin(id){const p=pins.find(x=>x.id===id);if(!p)return;if((p.view||'')!==view()){location.hash=p.view||'#1';setTimeout(()=>focusPin(id),300);return}const at=where(p);scrollTo({left:Math.max(0,at.x-innerWidth/2),top:Math.max(0,at.y-innerHeight/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
addEventListener('message',e=>{if(e.source!==P)return;const m=e.data||{};if(m.type==='share:mode')setMode(!!m.on);else if(m.type==='share:pins'){pins=Array.isArray(m.pins)?m.pins.slice(0,1000):[];draw()}else if(m.type==='share:focus')focusPin(m.id)});
addEventListener('hashchange',()=>{setTimeout(draw,50);setTimeout(draw,450);post({type:'share:view',view:view()})});addEventListener('resize',()=>setTimeout(draw,50));
const ready=()=>{post({type:'share:ready',view:view()});draw()};if(document.readyState==='loading')addEventListener('DOMContentLoaded',ready);else ready();setTimeout(ready,1500)})()</script>
