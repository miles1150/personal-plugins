<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miles Works · 用户旅程</title><link rel="stylesheet" href="system/styles.css"><style>body{background:var(--bg)}main{max-width:1200px;margin:auto;padding:48px 24px}h1{font-size:34px}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:32px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.tabs button{font-size:12px}.tabs .active{background:var(--accent);color:white;border-color:var(--accent)}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}.node{padding:24px;position:relative}.node h2{font-size:18px;margin:14px 0 10px}.node p{font-size:13px;line-height:1.9}.lane{font:11px var(--mono);color:var(--accent-deep);letter-spacing:.04em}.error{border-top:1px solid var(--border);padding-top:14px;margin-top:18px;color:var(--warning);font-size:12px}.number{font-size:32px;color:var(--border-strong);float:right}.intro{font-size:14px;max-width:800px}.boundary{padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:16px}.boundary p{margin-bottom:0;font-size:13px;line-height:1.9}@media(max-width:800px){main{padding:28px 16px}.flow{grid-template-columns:1fr}.number{font-size:26px}h1{font-size:28px}}</style></head><body><main><nav aria-label="评审导航"><a href="index.html">交互原型</a><a href="review.html">完整评审报告</a><a href="system/preview.html">设计系统</a></nav><span class="eyebrow">设计提案 · 7 条完整旅程</span><h1 style="margin-top:16px">少一些来回，多一份确定。</h1><p class="intro">每一段都标出发生位置、已有基础、待实现能力和失败后的去处。顺序按 01 → 06；所有操作都是设计说明。</p><div id="tabs" class="tabs" role="group" aria-label="选择旅程"></div><section id="flow" aria-live="polite"></section><div class="boundary"><strong>四条边界始终可见</strong><p>人的账户登录 ≠ 助手授权；Space 消息成员资格 ≠ 密钥读取；MCP 连接成功 ≠ 后台常驻运行；通知已接受 ≠ 任务已完成。</p></div></main><script>const flows=[["新机器 · Codex / Claude", "一次确认消息范围，先完成交接，再增加其他能力。", [["用户／宿主", "选择接入", "安装或复用 miles-works；只连接消息能力。", "现有", "安装失败：保留网页入口。"], ["浏览器／账户", "登录并审阅", "真实客户端资源、回调、Space 与助手名称可见；成员能力准确说明。", "部分现有", "拒绝或过期：返回原宿主重开。"], ["账户管理", "准备默认身份", "新账号创建个人 Space；独立助手及收取进度；幂等恢复。", "需组合实现", "半完成：恢复原请求，不重复造身份。"], ["宿主／MCP", "确认连接", "回原宿主完成 OAuth，再测试发出、收到和读取。", "待真实验收", "浏览器成功不代表宿主已连接。"], ["本机或宿主", "选择接收", "Codex 可设固定会话；Claude 先按需检查，后台能力另验收。", "部分现有", "休眠、退出、会话关闭：保持消息保存。"], ["用户／工作台", "开始协作", "进入同一收件箱，密钥在真正需要时再授权。", "设计目标", "权限缺失：说明能力，不扩大授权。"]]], ["Grok · 无插件", "连接器入口和后台运行必须按实际 Grok 产品分别验收。", [["用户／Grok", "添加 MCP 地址", "无需插件；只复制服务 URL，不复制 token 或 key。", "官方能力待兼容", "无 MCP：使用网页工作台。"], ["浏览器／账户", "确认消息范围", "账户登录、选 Space 和助手，审阅真实客户端与回调。", "沿用授权", "不支持 OAuth：标记具体阻碍。"], ["Grok／MCP", "验证当次调用", "describe、发送与收件；宿主审批另外完成。", "待真实验收", "连上但工具不可用：保持待验证。"], ["Grok 宿主", "先按需接收", "当前对话发起查询，模型不会因 MCP 自动常驻轮询。", "安全默认", "对话关闭：不承诺继续工作。"], ["宿主调度", "可选后台", "schedule 或 webhook 各自验证凭据、游标、去重和审批。", "研究目标", "Grok.com 与 Grok Bot 协议不可互换。"], ["用户／工作台", "查看真实进度", "云端保存、通知、接收、处理分别确认。", "统一体验", "200 / 202 或 routine 成功不代替业务结果。"]]], ["消息发送与回复", "账户选 Space，不让普通助手凭消息参数越过 Space 边界。", [["账户工作台", "确定范围", "从账户所有 Space 中选择一个，收件人按该 Space 重新解析。", "部分待实现", "切换后清空旧收件人。"], ["用户／助手", "发送内容", "明确目标、线程与引用；稳定 request_id。", "现有发送能力", "不在旧线程成员中：新建消息。"], ["云端消息", "持久保存", "只有确认提交后显示已存入云端。", "现有", "响应丢失：查原结果，不换 ID 重发。"], ["接收程序", "通知引用", "本机 bridge 保存账本，只发送已验证引用。", "现有", "通知未知：先核对，不自动重发。"], ["接收助手", "可靠接收", "按自身权限重新取内容，保存后提交 received。", "现有语义", "外部正文不能扩大宿主权限。"], ["接收助手", "处理并回复", "保存结果后 processed；用显式收件人回复。", "现有语义", "processed 不等于外部业务成功。"]]], ["按需密钥", "消息连接不隐含密钥访问；条目级授权与字段级最少读取分开。", [["任务／助手", "确认用途", "按名称、用途和允许的元数据定位条目；不确定则询问。", "现有工具", "看不到条目：不猜测隐藏值。"], ["密钥授权页", "选择条目", "读、改、创建初始关闭；全部现有与未来条目位于高级区。", "现有基础＋设计", "拒绝密钥不影响消息。"], ["用户／浏览器", "明确同意", "展示真实资源和客户端；值会进入宿主工具结果与模型上下文。", "现有边界", "会话过旧：重新登录并复审范围。"], ["宿主／keys", "按需读取", "只取任务所需字段；授权覆盖整个条目，不是假字段 ACL。", "现有", "过期、禁用、缺权限：停止并明确原因。"], ["任务执行", "受控使用", "避免聊天手填；日志、仓库、回复不含值；清理临时文件。", "流程约束", "这些纪律不会让模型看不到 fetch 结果。"], ["账户管理", "撤销或轮换", "撤销旧 grant；已返回值无法收回，怀疑泄露需服务商轮换。", "现有撤销", "缩权当前撤销后重连；不可假装在线编辑。"]]], ["后台接收与异常", "保留本机账本和固定绑定，unknown 是独立可恢复状态。", [["用户／设备", "选择固定目标", "指定设备、Codex 会话、受信接收程序。", "现有基础＋向导目标", "会话迁移：旧队列不静默改投。"], ["用户／账户", "确认持续运行", "当前用户登录后运行；独立凭据仍有成员能力。", "需安装集成", "不能描述为只读凭据。"], ["本机程序", "发现并记账", "约 30–60 秒检查，退避、单实例锁、写前日志。", "现有", "离线／休眠：消息仍在云端。"], ["本机会话", "投递通知", "明确接受才记录 accepted；响应丢失记 unknown。", "现有", "不能把通知接受记成 processed。"], ["只读核对", "对照原会话", "找到标记可确认；找不到仍不能证明没投递。", "现有 Codex reconcile", "通用 webhook 无查询时保留未知。"], ["人工恢复", "决定是否重试", "独立确认未投递后才重新入队；保留去重账本。", "现有能力＋设计", "重装／删库会引入重复通知。"]]], ["撤销与设备丢失", "多个独立凭据逐项处理，不能把浏览器退出当撤销全部。", [["用户／账户", "盘点连接", "浏览器、消息、keys、bridge、legacy 分开列出。", "部分现有", "来源不全：显示仍待确认。"], ["账户管理", "撤销消息", "阻止该凭据后续收发与共享资料操作。", "现有", "其他消息凭据或 bridge 可能仍有效。"], ["密钥管理", "撤销 keys", "阻止后续读取与修改，不影响消息连接。", "现有", "已返回给模型的值无法收回。"], ["本机管理", "停止或卸载接收", "停止持续运行，独立撤销接收凭据。", "本机现有／统一控制待实现", "保留必要投递账本，处理 unknown。"], ["真实服务商", "必要时轮换", "怀疑泄露的密钥在发放处吊销或轮换。", "用户操作", "从 Miles Works 删除不等于提供方失效。"], ["账户工作台", "核对结果", "逐项显示成功、失败、待确认，再重查。", "设计目标", "不承诺不存在的跨服务原子撤销。"]]], ["MCP 创建 Space／连接", "模型只提出意图，管理批准由浏览器账户完成。", [["用户／助手", "表达意图", "例如创建旅行项目 Space，并准备 Grok 调研助手。", "目标", "普通 MCP 当前无此工具。"], ["拟议 MCP", "保存待批请求", "绑定发起宿主、名称、范围、幂等 ID 与过期时间。", "待技术设计", "不给模型账户 cookie 或 owner key。"], ["浏览器／账户", "审阅差异", "创建什么、连接谁、涉及哪个 Space、是否包含密钥。", "原型示意", "近期登录；拒绝／取消不签发。"], ["账户管理", "批准并准备", "创建 Space／身份；返回原请求状态，不泄露凭据到聊天。", "待技术设计", "部分完成可恢复；不得重复创建。"], ["实际宿主", "接上连接", "原宿主完成自己的认证与往返测试。", "待兼容验收", "批准不是宿主已连接的证据。"], ["工作台", "呈现结果", "显示 Space 与等待验证的连接；独立撤销。", "设计目标", "后台运行与 keys 继续按需批准。"]]]];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(i){document.getElementById('tabs').innerHTML=flows.map((f,j)=>'<button type="button" class="secondary '+(i===j?'active':'')+'" aria-pressed="'+(i===j)+'" data-i="'+j+'">'+esc(f[0])+'</button>').join('');document.getElementById('flow').innerHTML='<h2>'+esc(flows[i][0])+'</h2><p>'+esc(flows[i][1])+'</p><div class="flow">'+flows[i][2].map((n,j)=>'<article class="node panel"><span class="number">0'+(j+1)+'</span><div class="lane">'+esc(n[0])+'</div><h2>'+esc(n[1])+'</h2><p>'+esc(n[2])+'</p><span class="tag">'+esc(n[3])+'</span><div class="error">恢复路径 · '+esc(n[4])+'</div></article>').join('')+'</div>';}document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)show(Number(b.dataset.i));});show(0);</script></body></html>
